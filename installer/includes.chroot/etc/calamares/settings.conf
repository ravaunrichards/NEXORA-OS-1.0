---
modules-search: [ local ]

instances:
  - id: cleanup-live-installer
    module: shellprocess
    config: shellprocess-cleanup-installer.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - initramfscfg
      - initramfs
      - grubcfg
      - bootloader
      - packages
      - shellprocess@cleanup-live-installer
      - umount
  - show:
      - finished

branding: nexora
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
