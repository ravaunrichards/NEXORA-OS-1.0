---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 32MiB
  label: "EFI"

# Require an explicit choice. In particular, never preselect disk erasure.
initialPartitioningChoice: none
initialSwapChoice: none
userSwapChoices:
  - none

defaultFileSystemType: "ext4"
availableFileSystemTypes:
  - "ext4"
  - "btrfs"

# Encrypted-root support is deliberately unavailable until the complete
# Ubuntu Resolute GRUB/initramfs unlock chain passes NEXORA's own tests.
enableLuksAutomatedPartitioning: false

lvm:
  enable: true
