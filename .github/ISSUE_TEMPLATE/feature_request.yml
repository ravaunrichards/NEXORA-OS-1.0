name: Feature request
description: Propose a specific improvement to NEXORA OS.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: "Describe a real user problem and a testable outcome. Do not use this form to report security vulnerabilities."
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is affected and what task is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the behavior from the user's perspective.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Project area
      options:
        - NEXORA Classic
        - NEXORA Flow
        - Installer and recovery
        - System settings and services
        - Applications
        - Security and updates
        - Build and release
        - Accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would prove the feature works.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include constraints, trade-offs, and compatibility concerns.
    validations:
      required: false
