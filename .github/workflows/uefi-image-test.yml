name: Test NEXORA UEFI ISO image construction

on:
  push:
    paths:
      - "build/add-uefi-boot.sh"
      - "build/test-add-uefi-boot.sh"
      - ".github/workflows/uefi-image-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out NEXORA source
        uses: actions/checkout@v4

      - name: Install isolated ISO and UEFI test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build isolinux xorriso grub-efi-amd64-bin dosfstools mtools

      - name: Test BIOS preservation and UEFI EFI-image insertion
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n build/add-uefi-boot.sh
          bash -n build/test-add-uefi-boot.sh
          bash build/test-add-uefi-boot.sh | tee "$RUNNER_TEMP/nexora-uefi-test.log"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-UEFI-image-test-${{ github.run_number }}
          path: ${{ runner.temp }}/nexora-uefi-test.log
          if-no-files-found: warn
          retention-days: 14
