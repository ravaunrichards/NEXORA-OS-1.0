name: Verify NEXORA Ubuntu-targeted live-build configuration

on:
  push:
    paths:
      - ".github/workflows/bootloader-option-probe.yml"
      - "build/build-iso.sh"
      - "build/test-live-build-compatibility.sh"
      - "build/configure-ubuntu-archives.sh"
      - "build/prepare-syslinux-bootloaders.sh"
      - "build/prepare-casper-syslinux-overlay.sh"
      - "build/test-casper-syslinux-overlay.sh"
      - "build/test-syslinux-bootloader-staging.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      NEXORA_SNAPSHOT: "20261109T000000Z"
    steps:
      - name: Check out NEXORA source
        uses: actions/checkout@v4

      - name: Install live-build and Ubuntu trust roots
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y live-build ubuntu-keyring isolinux syslinux-common binutils librsvg2-bin
          test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
          test -s /usr/lib/ISOLINUX/isolinux.bin
          test -s /usr/lib/syslinux/modules/bios/vesamenu.c32
          test -s /usr/lib/syslinux/modules/bios/ldlinux.c32
          test -s /usr/lib/syslinux/modules/bios/libcom32.c32
          test -s /usr/lib/syslinux/modules/bios/libutil.c32
          readelf -d /usr/lib/syslinux/modules/bios/vesamenu.c32 > "$RUNNER_TEMP/vesamenu-dependencies.txt"
          grep -Fq "[libutil.c32]" "$RUNNER_TEMP/vesamenu-dependencies.txt"
          grep -Fq "[libcom32.c32]" "$RUNNER_TEMP/vesamenu-dependencies.txt"
          lb --version
          grep -nE 'rsvg|splash\.svg' /usr/lib/live/build/lb_binary_syslinux
          command -v rsvg-convert
          rsvg-convert --version
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8"><rect width="8" height="8" fill="#345678"/></svg>\n' > "$RUNNER_TEMP/nexora-rsvg-test.svg"
          rsvg-convert --format png --height 8 --width 8 "$RUNNER_TEMP/nexora-rsvg-test.svg" -o "$RUNNER_TEMP/nexora-rsvg-test.png"
          test -s "$RUNNER_TEMP/nexora-rsvg-test.png"

      - name: Validate Ubuntu Resolute suite, keyring, Casper and generic boot theme
        shell: bash
        run: |
          set -Eeuo pipefail
          probe_dir="$RUNNER_TEMP/nexora-lb-probe"
          mkdir -p "$probe_dir"
          cd "$probe_dir"
          bash "$GITHUB_WORKSPACE/build/prepare-syslinux-bootloaders.sh" "$probe_dir/config"
          test -s "$probe_dir/config/bootloaders/isolinux/isolinux.bin"
          bash "$GITHUB_WORKSPACE/build/prepare-casper-syslinux-overlay.sh" "$probe_dir/live-build-overlay"
          export LIVE_BUILD="$probe_dir/live-build-overlay"
          test -x "$LIVE_BUILD/scripts/build/lb_binary_syslinux"
          grep -Fq 'binary/${_NEXORA_INITRAMFS_DIR}/vmlinuz-*' "$LIVE_BUILD/scripts/build/lb_binary_syslinux"
          grep -Fq '/${_NEXORA_INITRAMFS_DIR}/vmlinuz' "$LIVE_BUILD/scripts/build/lb_binary_syslinux"
          grep -Fq '/usr/bin/rsvg-convert' "$LIVE_BUILD/scripts/build/lb_binary_syslinux"
          grep -Fq 'Chroot chroot "rsvg-convert --format png --height 480 --width 640 splash.svg -o splash.png"' "$LIVE_BUILD/scripts/build/lb_binary_syslinux"
          grep -Fq 'rsvg-convert --format png --height 480 --width 640 "${_TARGET}/splash.svg" -o "${_TARGET}/splash.png"' "$LIVE_BUILD/scripts/build/lb_binary_syslinux"
          ! grep -Eq '(^|[^[:alnum:]_-])rsvg([^[:alnum:]_-]|$)' "$LIVE_BUILD/scripts/build/lb_binary_syslinux"
          cat > "$LIVE_BUILD/scripts/build/lb_nexora_overlay_probe" <<'PROBE'
          #!/usr/bin/env bash
          printf 'private-live-build-overlay-selected\n'
          PROBE
          chmod 0755 "$LIVE_BUILD/scripts/build/lb_nexora_overlay_probe"
          lb_output="$(lb nexora_overlay_probe)"
          grep -Fq 'private-live-build-overlay-selected' <<< "$lb_output"
          test -s "$probe_dir/config/bootloaders/isolinux/vesamenu.c32"
          test -s "$probe_dir/config/bootloaders/isolinux/ldlinux.c32"
          test -s "$probe_dir/config/bootloaders/isolinux/libcom32.c32"
          test -s "$probe_dir/config/bootloaders/isolinux/libutil.c32"
          live_args="boot=casper console=ttyS0,115200n8 console=tty0 systemd.show_status=1 systemd.log_target=console"
          export LB_UPDATES=true

          lb config \
            --mode debian \
            --distribution resolute \
            --parent-distribution resolute \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --bootloader syslinux \
            --syslinux-theme live-build \
            --bootstrap-keyring /usr/share/keyrings/ubuntu-archive-keyring.gpg \
            --keyring-packages ubuntu-keyring \
            --initramfs casper \
            --initsystem systemd \
            --memtest none \
            --security false \
            --bootappend-live "$live_args" \
            --archive-areas "main restricted universe multiverse" \
            --parent-archive-areas "main restricted universe multiverse"

          dump="$probe_dir/config-dump.txt"
          lb config --dump > "$dump"
          grep -Eq '(^|: )LB_MODE="debian"$' "$dump"
          grep -Eq '(^|: )LB_DISTRIBUTION="resolute"$' "$dump"
          grep -Eq '(^|: )LB_PARENT_DISTRIBUTION="resolute"$' "$dump"
          grep -Eq '(^|: )LB_INITRAMFS="casper"$' "$dump"
          grep -Eq '(^|: )LB_SYSLINUX_THEME="live-build"$' "$dump"
          grep -Eq '(^|: )LB_SECURITY="false"$' "$dump"
          grep -Fq '/usr/share/keyrings/ubuntu-archive-keyring.gpg' "$dump"
          grep -Fq 'ubuntu-keyring' "$dump"
          grep -Fq 'boot=casper' "$dump"
          bash "$GITHUB_WORKSPACE/build/test-live-build-compatibility.sh"

          bash "$GITHUB_WORKSPACE/build/configure-ubuntu-archives.sh" "$probe_dir/config" "$NEXORA_SNAPSHOT"
          grep -Fq "resolute-security" "$probe_dir/config/archives/nexora-security.list.chroot"
          grep -Fq "resolute-security" "$probe_dir/config/archives/nexora-security.list.binary"

          {
            echo "## NEXORA Ubuntu-targeted live-build configuration"
            echo
            lb --version
            echo
            cat "$dump"
            echo
            echo "### Available EFI-related package candidates"
            apt-cache policy syslinux-efi grub-efi-amd64-bin grub-efi-amd64-signed || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-ubuntu-live-build-config
          path: "${{ runner.temp }}/nexora-lb-probe/"
          if-no-files-found: warn
          retention-days: 14
