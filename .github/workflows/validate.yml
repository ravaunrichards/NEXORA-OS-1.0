name: Validate NEXORA repository foundation

on:
  push:
    paths:
      - ".github/**"
      - "build/**"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".gitignore"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate package manifest, repository files, all shell scripts, and GitHub YAML
        shell: bash
        run: bash build/validate-config.sh
