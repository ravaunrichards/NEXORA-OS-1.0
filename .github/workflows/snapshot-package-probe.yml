name: Diagnose NEXORA Ubuntu snapshot package URLs

on:
  push:
    paths:
      - ".github/workflows/snapshot-package-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      SNAPSHOT: "20261109T000000Z"
    steps:
      - name: Probe snapshot and archive package URLs without installing
        shell: bash
        run: |
          set -u
          base="https://snapshot.ubuntu.com/ubuntu/$SNAPSHOT"
          archive="https://archive.ubuntu.com/ubuntu"
          paths=(
            "dists/resolute/Contents-amd64.gz"
            "pool/main/p/p11-kit/libp11-kit0_0.26.2-2_amd64.deb"
            "pool/main/p/pam/libpam-modules_1.7.0-5ubuntu3_amd64.deb"
            "pool/main/a/adduser/adduser_3.153ubuntu1_all.deb"
            "pool/main/s/systemd/systemd_259.5-0ubuntu3_amd64.deb"
            "pool/main/libx/libxcrypt/libcrypt1_4.5.1-1_amd64.deb"
            "pool/main/c/cdebconf/libdebconfclient0_0.280ubuntu1_amd64.deb"
            "pool/main/l/lvm2/libdevmapper1.02.1_1.02.205-2ubuntu3_amd64.deb"
          )
          {
            echo "## Ubuntu snapshot package URL diagnostics"
            echo "Snapshot: $SNAPSHOT"
            echo
            for relative in "${paths[@]}"; do
              echo "### $relative"
              for label in snapshot archive; do
                if [[ "$label" == snapshot ]]; then url="$base/$relative"; else url="$archive/$relative"; fi
                echo "- $label: $url"
                curl --location --silent --show-error --output /dev/null \
                  --max-time 35 --write-out 'HTTP %{http_code}; downloaded %{size_download} bytes; final URL %{url_effective}\\n' \
                  "$url" || echo "curl_exit=$?"
              done
              echo
            done
          } | tee "$RUNNER_TEMP/snapshot-probe.txt"
      - name: Inspect Ubuntu Resolute debootstrap download implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap
          {
            echo "## debootstrap implementation details"
            echo "Package: $(dpkg-query -W -f='${Version}' debootstrap)"
            for file in /usr/sbin/debootstrap /usr/share/debootstrap/functions; do
              echo
              echo "### $file"
              grep -nE 'PATH=|wget|download_file|download.*\(' "$file" | head -180 || true
            done
            echo
            echo "### debootstrap package verification code (download + checksum)"
            sed -n '430,485p' /usr/share/debootstrap/functions
            echo
            echo "### debootstrap package download/validation loop"
            sed -n '835,880p' /usr/share/debootstrap/functions
          } | tee "$RUNNER_TEMP/debootstrap-download-implementation.txt"
      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-snapshot-url-diagnostic
          path: |
            ${{ runner.temp }}/snapshot-probe.txt
            ${{ runner.temp }}/debootstrap-download-implementation.txt
          if-no-files-found: warn
          retention-days: 14
