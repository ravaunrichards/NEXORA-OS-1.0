name: NEXORA BIOS and UEFI firmware boot smoke tests

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: GitHub Actions run ID containing the completed NEXORA ISO artifact
        required: true
        type: string
      artifact_name:
        description: Exact artifact name from the ISO build run (for example NEXORA-26.04-amd64-engineering-27)
        required: true
        type: string
  workflow_run:
    workflows:
      - Build NEXORA engineering ISO
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  firmware-boot:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    name: Boot NEXORA ISO with BIOS and UEFI firmware
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      ARTIFACT_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.artifact_run_id }}
      ARTIFACT_NAME: ${{ github.event_name == 'workflow_run' && format('NEXORA-26.04-amd64-engineering-{0}', github.event.workflow_run.run_number) || inputs.artifact_name }}
    steps:
      - name: Check out NEXORA verification scripts
        uses: actions/checkout@v4

      - name: Install QEMU and OVMF firmware
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso

      - name: Download the selected ISO build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nexora-artifact

      - name: Verify ISO checksum and boot-image structure
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t isos < <(find "$RUNNER_TEMP/nexora-artifact" -type f -name '*.iso' -print | sort)
          [[ "${#isos[@]}" -eq 1 ]] || {
            echo "::error::Expected exactly one ISO in the selected artifact; found ${#isos[@]}."
            find "$RUNNER_TEMP/nexora-artifact" -maxdepth 4 -type f -print
            exit 1
          }
          ISO_PATH="${isos[0]}"
          echo "NEXORA_ISO=$ISO_PATH" >> "$GITHUB_ENV"
          checksum="$ISO_PATH.sha256"
          [[ -s "$checksum" ]] || {
            echo "::error::The selected ISO artifact has no adjacent SHA-256 manifest."
            exit 1
          }
          (cd "$(dirname "$ISO_PATH")" && sha256sum -c "$(basename "$checksum")")
          bash build/verify-iso.sh "$ISO_PATH"

      - name: Run legacy BIOS live-system boot test
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/nexora-bios-boot.log"
          bash build/run-qemu-live-boot.sh \
            "$log" 900 \
            'Reached target.*(graphical\.target|Graphical Interface|multi-user\.target|Multi-User System)|Started.*(SDDM|display manager)' \
            -- qemu-system-x86_64 \
              -machine pc,accel=tcg -cpu max -m 8192 -smp 2 \
              -display none -serial "file:$log" -monitor none \
              -no-reboot -nic none \
              -cdrom "$NEXORA_ISO" -boot order=d

      - name: Run UEFI live-system boot test with OVMF
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t code_candidates < <(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE*.fd' ! -iname '*secboot*' -print | sort)
          [[ "${#code_candidates[@]}" -gt 0 ]] || {
            echo "::error::No non-Secure-Boot OVMF_CODE firmware image was installed."
            exit 1
          }

          OVMF_CODE="${code_candidates[0]}"
          code_name="$(basename "$OVMF_CODE")"
          vars_name="${code_name/OVMF_CODE/OVMF_VARS}"
          OVMF_VARS="$(dirname "$OVMF_CODE")/$vars_name"
          [[ -s "$OVMF_VARS" ]] || {
            echo "::error::Matching OVMF variable template not found: $OVMF_VARS"
            exit 1
          }

          vars_copy="$RUNNER_TEMP/OVMF_VARS-test.fd"
          cp "$OVMF_VARS" "$vars_copy"
          log="$RUNNER_TEMP/nexora-uefi-boot.log"
          bash build/run-qemu-live-boot.sh \
            "$log" 900 \
            'Reached target.*(graphical\.target|Graphical Interface|multi-user\.target|Multi-User System)|Started.*(SDDM|display manager)' \
            -- qemu-system-x86_64 \
              -machine q35,accel=tcg -cpu max -m 8192 -smp 2 \
              -drive "if=pflash,format=raw,readonly=on,file=$OVMF_CODE" \
              -drive "if=pflash,format=raw,file=$vars_copy" \
              -display none -serial "file:$log" -monitor none \
              -no-reboot -nic none \
              -cdrom "$NEXORA_ISO" -boot order=d

      - name: Run legacy BIOS USB boot test
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/nexora-bios-usb-boot.log"
          bash build/run-qemu-live-boot.sh \
            "$log" 900 \
            'Reached target.*(graphical\.target|Graphical Interface|multi-user\.target|Multi-User System)|Started.*(SDDM|display manager)' \
            -- qemu-system-x86_64 \
              -machine pc,accel=tcg -cpu max -m 8192 -smp 2 \
              -usb \
              -drive "if=none,id=nexorausb,format=raw,file=$NEXORA_ISO" \
              -device usb-storage,drive=nexorausb,bootindex=1 \
              -display none -serial "file:$log" -monitor none \
              -no-reboot -nic none -boot menu=on

      - name: Run UEFI USB boot test with OVMF
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t code_candidates < <(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE*.fd' ! -iname '*secboot*' -print | sort)
          [[ "${#code_candidates[@]}" -gt 0 ]] || {
            echo "::error::No non-Secure-Boot OVMF_CODE firmware image was installed."
            exit 1
          }

          OVMF_CODE="${code_candidates[0]}"
          code_name="$(basename "$OVMF_CODE")"
          vars_name="${code_name/OVMF_CODE/OVMF_VARS}"
          OVMF_VARS="$(dirname "$OVMF_CODE")/$vars_name"
          [[ -s "$OVMF_VARS" ]] || {
            echo "::error::Matching OVMF variable template not found: $OVMF_VARS"
            exit 1
          }

          vars_copy="$RUNNER_TEMP/OVMF_VARS-USB-test.fd"
          cp "$OVMF_VARS" "$vars_copy"
          log="$RUNNER_TEMP/nexora-uefi-usb-boot.log"
          bash build/run-qemu-live-boot.sh \
            "$log" 900 \
            'Reached target.*(graphical\.target|Graphical Interface|multi-user\.target|Multi-User System)|Started.*(SDDM|display manager)' \
            -- qemu-system-x86_64 \
              -machine q35,accel=tcg -cpu max -m 8192 -smp 2 \
              -drive "if=pflash,format=raw,readonly=on,file=$OVMF_CODE" \
              -drive "if=pflash,format=raw,file=$vars_copy" \
              -device qemu-xhci,id=nexora-xhci \
              -drive "if=none,id=nexorausb,format=raw,file=$NEXORA_ISO" \
              -device usb-storage,drive=nexorausb,bus=nexora-xhci.0,bootindex=1 \
              -display none -serial "file:$log" -monitor none \
              -no-reboot -nic none -boot menu=on

      - name: Upload firmware boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-firmware-boot-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/nexora-bios-boot.log
            ${{ runner.temp }}/nexora-uefi-boot.log
            ${{ runner.temp }}/nexora-bios-usb-boot.log
            ${{ runner.temp }}/nexora-uefi-usb-boot.log
          if-no-files-found: warn
          retention-days: 30
